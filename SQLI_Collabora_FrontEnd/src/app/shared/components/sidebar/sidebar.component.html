<div
  [ngClass]="{ 'w-64': isOpen, 'w-20': !isOpen }"
  class="h-screen bg-white border-r border-slate-200 p-4 flex flex-col justify-between transition-[width] duration-300 ease-in-out text-slate-600 shadow-sm"
>
  <!-- Haut -->
  <div>
    <!-- Logo -->
    <div class="mb-8">
      <div class="flex items-center" [ngClass]="{ 'gap-3': isOpen, 'justify-center': !isOpen }">
        <img [src]="imgUrl" alt="Collabora" class="w-10 h-10 object-cover" />
        <h1
          *ngIf="isOpen"
          class="font-bold text-xl text-[#16306B] whitespace-nowrap overflow-hidden transition-opacity duration-200"
        >
          Collabora
        </h1>
      </div>
      <div class="mt-5 h-px bg-slate-200/70"></div>
    </div>

    <!-- Navigation -->
    <nav class="mt-12 space-y-6">
      <ng-container *ngFor="let item of menuItems">
        <a
          [routerLink]="item.link"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-[#f4f0ff] text-[#6f3ef6] font-semibold shadow-sm"
          class="relative text-sm flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-50 transition-all duration-200"
          [ngClass]="{ 'justify-center px-0 py-2 rounded-full w-12 h-12': !isOpen }"
        >
          <span
            *ngIf="isRouteActive(item.link)"
            class="absolute -left-3 top-2 bottom-2 w-[3px] rounded-full bg-[#6f3ef6]"
          ></span>

          <img
            *ngIf="item.iconType === 'img'"
            [src]="isRouteActive(item.link) ? item.iconActive : item.icon"
            class="w-5 h-5"
            [alt]="item.label"
          />
          <i
            *ngIf="item.iconType === 'fa'"
            [class]="item.icon"
            [ngClass]="isRouteActive(item.link) ? 'text-[#6f3ef6]' : 'text-[#9fa3ae]'"
          ></i>

          <span *ngIf="isOpen" class="whitespace-nowrap overflow-hidden transition-opacity duration-200">
            {{ item.label }}
          </span>
        </a>
      </ng-container>
    </nav>
  </div>

  <!-- Bas -->
  <div>
    <!-- Nouveau projet -->
    <button
      (click)="openNewProjectWizard()"
      class="flex items-center gap-2 bg-primary-start text-white text-xs font-medium rounded-xl hover:shadow-lg transition-all duration-200"
      [ngClass]="{
        'px-5 py-3 w-full justify-center': isOpen,
        'w-10 h-10 justify-center rounded-full': !isOpen
      }"
    >
      <i class="fa-solid fa-plus"></i>
      <span *ngIf="isOpen">Nouveau projet</span>
    </button>

    <div class="h-px bg-slate-200/70 my-4"></div>

    <!-- Déconnexion -->
    <button
      class="relative text-xs flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-50 transition-all duration-200 w-full text-slate-500"
      [ngClass]="{ 'justify-center px-0 py-2 rounded-full w-10 h-10': !isOpen }"
      (click)="onLogout()"
    >
      <i class="fas fa-sign-out-alt w-4 text-center text-[14px] text-[#9fa3ae]"></i>
      <span *ngIf="isOpen">Déconnexion</span>
    </button>
  </div>
</div>
