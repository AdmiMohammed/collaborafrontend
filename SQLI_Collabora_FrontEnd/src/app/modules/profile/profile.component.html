<main class="p-6 max-w-4xl overflow-auto mx-auto max-h-screen">
  <!-- En-tête -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
    <h1 class="text-2xl  font-bold text-gray-900">Informations du compte</h1>

    <ng-container *ngIf="!isEditing; else editMode">
      <button
        (click)="handleEdit()"
        class="bg-gradient-to-r from-[#7b2ff7] to-[#f107a3] text-white px-5 py-2.5 rounded-md hover:opacity-90 transition flex items-center gap-2"
      >
        <i class="fas fa-edit"></i>
        Modifier le profil
      </button>
    </ng-container>

    <ng-template #editMode>
      <div class="flex gap-2">
        <button
          (click)="handleSave()"
          class="bg-gradient-to-r from-[#7b2ff7] to-[#f107a3] text-white px-5 py-2.5 rounded-md hover:opacity-90 transition flex items-center gap-2"
        >
          <i class="fas fa-save"></i>
          Enregistrer
        </button>
        <button
          (click)="handleCancel()"
          class="border border-gray-300 px-5 py-2.5 rounded-md hover:bg-gray-100 transition flex items-center gap-2"
        >
          <i class="fas fa-times"></i>
          Annuler
        </button>
      </div>
    </ng-template>
  </div>

  <!-- Contenu du profil -->
  <div class="space-y-8">
    <!-- Avatar -->
    <div class="flex items-center gap-6">
      <div class="relative w-28 h-28">
        <div class="w-full h-full rounded-full border-4 border-purple-100 bg-purple-50 flex items-center justify-center text-purple-700 font-bold text-2xl overflow-hidden">
          <ng-container *ngIf="userData.avatar; else initialsOnly">
            <img [src]="userData.avatar" [alt]="userData.lastName" class="w-full h-full object-cover rounded-full" />
          </ng-container>
          <ng-template #initialsOnly>{{ initials }}</ng-template>
        </div>

        <!-- Bouton pour modifier l'avatar -->
        <button
          *ngIf="isEditing"
          class="absolute -bottom-2 -right-2 w-9 h-9 rounded-full bg-white shadow border flex items-center justify-center hover:bg-gray-100 transition"
        >
          <i class="fas fa-edit text-gray-700 text-sm"></i>
        </button>
      </div>

      <div>
        <h2 class="text-xl font-semibold text-gray-900">
          {{ userData.firstName }} {{ userData.lastName }}
        </h2>
        <p class="text-gray-500">{{ userData.phoneNumber }}</p>
      </div>
    </div>

    <!-- Champs modifiables -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Prénom -->
      <div>
        <label class="text-sm font-medium text-gray-600 block mb-1">Prénom</label>
        <ng-container *ngIf="isEditing; else firstNameView">
          <input
            [(ngModel)]="editedUserData.firstName"
            class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="Prénom"
          />
        </ng-container>
        <ng-template #firstNameView>
          <p class="text-gray-900">{{ userData.firstName }}</p>
        </ng-template>
      </div>

      <!-- Nom -->
      <div>
        <label class="text-sm font-medium text-gray-600 block mb-1">Nom</label>
        <ng-container *ngIf="isEditing; else lastNameView">
          <input
            [(ngModel)]="editedUserData.lastName"
            class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="Nom"
          />
        </ng-container>
        <ng-template #lastNameView>
          <p class="text-gray-900">{{ userData.lastName }}</p>
        </ng-template>
      </div>

      <!-- Adresse e-mail -->
      <div>
        <label class="text-sm font-medium text-gray-600 block mb-1">Adresse e-mail</label>
        <ng-container *ngIf="isEditing; else emailView">
          <input
            type="email"
            [(ngModel)]="editedUserData.email"
            class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="Adresse e-mail"
          />
        </ng-container>
        <ng-template #emailView>
          <div class="flex items-center gap-2 text-gray-700">
            {{ userData.email }}
          </div>
        </ng-template>
      </div>

      <!-- Numéro de téléphone -->
      <div>
        <label class="text-sm font-medium text-gray-600 block mb-1">Numéro de téléphone</label>
        <ng-container *ngIf="isEditing; else phoneView">
          <input
            [(ngModel)]="editedUserData.phoneNumber"
            class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="Numéro de téléphone"
          />
        </ng-container>
        <ng-template #phoneView>
          <div class="flex items-center gap-2 text-gray-700">
            {{ userData.phoneNumber }}
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</main>
