<div #searchContainer class="relative">
  <div class="hidden sm:flex items-center bg-white rounded-lg px-4
              py-2 w-72 md:w-96 shadow-sm focus-within:ring-1
              focus-within:ring-purple-500 transition-all duration-300">
    <i class="fa fa-search text-gray-400 text-sm mr-2"></i>
    <input 
      type="text" 
      [placeholder]="placeholder"
      [(ngModel)]="searchProject" 
      (input)="onSearchChange()"
      (focus)="onInputFocus()"
      class="bg-transparent text-sm placeholder-gray-400 w-full
             focus:outline-none" 
    />
  </div>

  <div *ngIf="isOpen" 
       class="absolute mt-4 w-72 md:w-96 bg-white border border-gray-200  py-2
              rounded-lg shadow-lg z-10 max-h-[380px] overflow-y-auto scrollbar-thin scrollbar-track-transparent scrollbar-thumb-background">

    <div *ngFor="let project of searchResults" 
         (click)="goToProject(project)"
         class="px-4 py-2 cursor-pointer hover:bg-gray-100 transition">
      <p class="text-sm font-medium text-[#16306B]">{{ project.name }}</p>
      <p class="text-xs text-gray-400 truncate">{{ project.description }}</p>
    </div>

    <div *ngIf="searchResults.length === 0" class="px-4 py-2 text-sm text-gray-500">
      Aucun projet trouvé
    </div>
  </div>
</div>
