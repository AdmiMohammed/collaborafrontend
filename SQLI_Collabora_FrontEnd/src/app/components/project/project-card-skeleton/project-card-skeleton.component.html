<!-- Animation Tailwind -->
<div class="animate-pulse">
  <!-- Variante GRID -->
  <div *ngIf="view === 'grid'"
       class="rounded-2xl border border-gray-100 bg-white p-4 shadow-sm min-h-[220px] flex flex-col gap-4">
    <!-- Badge skeleton -->
    <div
    class="inline-block bg-gray-200 w-16 px-3 py-3 rounded-full mb-2 animate-pulse"
    >
    </div>

    <!-- Description -->
    <div class="h-3 w-full bg-gray-200 rounded"></div>
    <div class="h-3 w-5/6 bg-gray-200 rounded"></div>

    <!-- Badges -->
    <div class="flex items-center gap-2">
      <div class="h-6 w-16 rounded-full bg-gray-200"></div>
      <div class="h-6 w-12 rounded-full bg-gray-200"></div>
      <div class="h-6 w-20 rounded-full bg-gray-200"></div>
    </div>

    <!-- Progress bar -->
    <div class="mt-auto">
      <div class="h-2 w-full rounded-full bg-gray-100 overflow-hidden">
        <div class="h-full w-1/2 bg-gray-200"></div>
      </div>
      <div class="h-3 w-10 mt-2 bg-gray-200 rounded"></div>
    </div>
  </div>

  <!-- Variante LIST -->
  <div *ngIf="view === 'list'"
       class="rounded-2xl border border-gray-100 bg-white p-4 shadow-sm min-h-[120px] flex items-center gap-4">
    <div class="h-12 w-12 rounded-xl bg-gray-200"></div>
    <div class="flex-1 space-y-2">
      <div class="h-3 w-3/4 bg-gray-200 rounded"></div>
      <div class="h-3 w-1/2 bg-gray-200 rounded"></div>
      <div class="h-2 w-full bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full w-1/3 bg-gray-200"></div>
      </div>
    </div>
    <div class="hidden sm:flex items-center gap-2">
      <div class="h-8 w-16 rounded-full bg-gray-200"></div>
      <div class="h-8 w-20 rounded-full bg-gray-200"></div>
    </div>
  </div>
</div>
