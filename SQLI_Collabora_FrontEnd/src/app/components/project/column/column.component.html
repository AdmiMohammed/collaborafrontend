<div class="flex flex-col max-h-[490px] min-w-[300px] max-w-[300px] 
           rounded-xl  p-4 border border-gray-300 hover:shadow-sm" 
          [attr.draggable]="!editingName">
  <!-- Header -->
  <div class="w-[90%] mx-auto flex items-center justify-between mb-2 cursor-move select-none">
    <div class="flex items-center space-x-2 min-w-[200px]">
      <!-- Inline edit container -->
      <div class="flex-1 min-w-0 max-w-full flex">
        <!-- Title (show when not editing) -->
        <h3 *ngIf="!editingName" class="flex-1 min-w-0 font-semibold text-blue-600 tooltip select-none
             whitespace-normal leading-snug break-words overflow-hidden" data-tooltip="Double-cliquez pour modifier"
          (dblclick)="startEditingName()">
          {{ column.name }}
        </h3>

        <!-- Input (show when editing) -->
        <input *ngIf="editingName" #nameInput type="text" [(ngModel)]="editedName" (blur)="finishEditingName()"
          (keydown.enter)="finishEditingName()"
          class="w-full text-md font-semibold text-[#1E293B] border-b focus:outline-none focus:ring-0 focus:border-[#6B7280]" />
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <!-- Column menu -->
      <div class="relative">
        <!-- Menu button -->
        <button (click)="onToggleMenu($event, column.id)"
                class="text-gray-600 p-1.5 rounded-full  hover:bg-gray-200 transition duration-200 tooltip"  aria-label="Options supplémentaires" type="button" data-tooltip="Options">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="19" cy="12" r="1"></circle>
            <circle cx="5" cy="12" r="1"></circle>
          </svg>
        </button>

        <!-- Dropdown -->
        <div *ngIf="menuOpen" [ngStyle]="{ left: menuLeft + 'px' }"
          class="absolute mt-2  text-sm w-56 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden z-50">
          <ul class="divide-y divide-gray-100">
            <li>
              <button
                (click)="archiveColumn()"
                class="w-full flex items-center gap-3 rounded-md px-3 py-1.5 hover:bg-purple-100 hover:text-purple-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
                </svg>
                Archiver la liste
              </button>
            </li>
            <li>
              <button
                class="w-full flex items-center gap-3 rounded-md px-3 py-1.5 hover:bg-purple-100 hover:text-purple-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
                </svg>

                Déplacer la liste
              </button>
            </li>
            <li>
              <button (click)="startAddingTask(true)"
                class="w-full flex items-center gap-3  rounded-md px-3 py-1.5 hover:bg-purple-100 hover:text-purple-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Ajouter une carte
              </button>
            </li>
            <li>
              <button (click)="startEditingName()"
                class="w-full flex items-center gap-3  rounded-md px-3 py-1.5 hover:bg-purple-100 hover:text-purple-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                </svg>

                Renommer la liste
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Tasks -->
 <div
  class="flex-1 overflow-x-hidden overflow-y-auto scrollbar-thin scrollbar-track-transparent scrollbar-thumb-background px-4">
  <div class="space-y-4">
    <div *ngFor="let task of column.tasks">
      <app-task-card [task]="task" [members]="members" (taskArchived)="onTaskArchived($event)"></app-task-card>
    </div>
    <div *ngIf="addingTask" class="mt-2">
      <input #taskInput type="text"
             [(ngModel)]="newTaskName" placeholder="Titre de la carte"
             class="w-full border border-gray-200 rounded-lg px-3 py-2 
                    mb-2 focus:outline-none focus:ring-1
                    focus-within:ring-purple-500 text-xs"
             (keydown.enter)="confirmAddTask()" />
    </div>
  </div>
</div>

   <!-- Ajouter une carte -->
  <div class="mt-2 w-[90%] mx-auto shrink-0">
  <ng-container *ngIf="addingTask; else addButton">
    <div class="flex justify-center gap-3">
      <button type="button"
              class="px-3 py-1 rounded-lg text-gray-500 border
                     border-gray-200 hover:border-primary-start
                     hover:text-primary-start transition duration-200 
                     text-sm"
        (click)="cancelAddTask()">
        Annuler
      </button>
      <button type="button"
              class="bg-primary-start text-white px-4 py-2
                       rounded-lg hover:shadow-md transition
                       duration-200 text-sm"
        (click)="confirmAddTask()">
        Ajouter
      </button>
    </div>
  </ng-container>

    <ng-template #addButton>
      <button
        class="w-full hover:bg-purple-100 text-purple-500 py-2 rounded-lg font-medium  transition-colors duration-300 flex items-center gap-1 justify-center"
        type="button" (click)="startAddingTask(true)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="1.5" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Ajouter une carte
      </button>
    </ng-template>
  </div>
</div>
