    <!-- Bouton Nouveau Projet -->

    >

           fill="none"
           viewBox="0 0 24 24"
           stroke-width="1.5"
           stroke="currentColor"
           class="w-5 h-5">

<div
  appSortable
  [items]="projects"
  (projectsReordered)="onProjectReorder($event)"
  [ngClass]="{
    'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6': isGridView,
    'flex flex-col gap-4': !isGridView
  }"

>
  <div *ngFor="let project of projects; let i = index">
    <app-project-card [project]="project" [index]="i" [view]="isGridView ? 'grid' : 'list'"></app-project-card>
  </div>
</div>
