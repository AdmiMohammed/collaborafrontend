<div *ngIf="project" class="flex flex-col h-screen bg-background p-4 sm:overflow-y-hidden">

  <!-- Topbar: fixed height for consistent layout -->
  <app-topbar class="h-16 shrink-0" [inProject]="true"></app-topbar>

  <!-- Main content fills remaining space, scrollable -->
  <main
    class="flex-1 bg-white rounded-2xl px-6 pt-6 flex flex-col overflow-y-auto scrollbar-thin scrollbar-track-transparent scrollbar-thumb-background sm:overflow-y-hidden">

    <div class="flex flex-col gap-6 min-h-0 flex-1">

      <!-- Project header component -->
      <app-board-header [project]="project"></app-board-header>

      <!-- Columns container: horizontal scroll on desktop, vertical stack on mobile -->
      <div class="flex flex-col gap-6 p-4 sm:flex-row min-h-0 min-w-0 flex-1
               sm:overflow-x-auto sm:overflow-y-visible
               scrollbar-thin scrollbar-track-transparent scrollbar-thumb-background" id="container" appSortable
        [items]="project.columns" (reordered)="onColumnsReorder($event)">
        <div class="flex flex-row gap-6" appSortable [items]="project.columns" (reordered)="onColumnsReorder($event)">

          <app-column *ngFor="let column of project.columns" [column]="column" [members]="project.members"
            [projectLabels]="project.labels" [menuOpen]="openMenuColumnId === column.id"
            (toggleMenu)="toggleMenu(column.id)" (labelsChanged)="onLabelsChanged($event)">
          </app-column>
        </div>

        <!-- If not adding a column, show button -->
        <button *ngIf="!addingColumn" class="min-w-[280px] max-w-[320px] h-14 flex items-center justify-center px-4 py-2 rounded-xl border-2 border-dashed border-primary-mid
         text-primary-mid font-semibold hover:bg-primary-mid hover:text-white transition duration-300 shrink-0"
          type="button" aria-label="Ajouter une colonne" (click)="openAddColumn()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          Ajouter une colonne
        </button>

        <!-- If adding a column, show input + buttons -->
        <div *ngIf="addingColumn"
          class="min-w-[280px] max-w-[320px] flex flex-col gap-3 rounded-xl border-2 border-primary-mid bg-white shadow-md shrink-0 p-3 self-start">

          <input #newColumnInput type="text"
            class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-mid"
            placeholder="Nom de la colonne" [(ngModel)]="newColumnName" (keydown.enter)="addColumn()" autofocus />

          <div class="flex gap-4">
            <button type="button"
              class="bg-primary-mid text-white px-4 py-2 rounded hover:bg-primary-end transition duration-200 font-semibold"
              (click)="addColumn()">
              Ajouter
            </button>

            <button type="button"
              class="px-4 py-2 rounded border border-gray-300 hover:border-primary-mid hover:text-primary-mid transition duration-200 font-semibold"
              (click)="cancelAddColumn()">
              Annuler
            </button>
          </div>

        </div>


      </div>
    </div>

  </main>

</div>
