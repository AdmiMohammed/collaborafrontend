<div  class=" bg-white rounded-2xl shadow p-5 border border-gray-100
         transition-all duration-300 ease-in-out
         hover:shadow-xl hover:-translate-y-1 hover:border-primary-mid cursor-pointer
         "
      (click)="goToProject(project.id)">

  <!-- Badge -->
  <div
    class="inline-block text-sm font-semibold px-3 py-2 rounded-full mb-4"
    [ngClass]="[
      getRandomBadgeColor(index).text,
      getRandomBadgeColor(index).bg
    ]"
  >
    {{ project.name }}
  </div>

  <!-- Description -->
  <div class="h-[3.8rem] overflow-hidden mb-1">
    <p class="text-base font-normal text-gray-600 leading-snug line-clamp-2">
      {{ project.description }}
    </p>
  </div>

  <!-- Date -->
  <div class="flex items-center text-xs text-gray-400 mb-3 gap-1">
    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
    </svg>
    <span>Créé le : {{ project.createdAt | date: 'dd/MM/yyyy' }}</span>
  </div>

  <!-- Progress -->
  <div class="flex items-center justify-between mb-1">
    <span class="text-xs font-medium text-[#8432df]">Progress</span>
    <span class="text-xs font-medium text-[#8432df]">
      {{ project.boardCount * 10 }}%
    </span>
  </div>

  <div class="w-full bg-gray-200 rounded-full h-2 mb-1">
    <div
      class="h-2 rounded-full"
      [ngStyle]="{
        background: 'linear-gradient(to right, #FC0FC0, #C020D0, #8432DF)',
        width: (project.boardCount * 10) + '%'
      }"
    ></div>
  </div>

  <!-- Tâches -->
  <div class="text-xs text-gray-500 mb-3">
    {{ project.completedTasks }}/{{ project.totalTasks }} tâches
  </div>

  <!-- Membres & stats -->
  <div class="flex items-center justify-between mt-2">
    <!-- Avatars -->
    <div class="flex -space-x-2">
      <ng-container *ngFor="let member of project.projectMembers.slice(0, 5)">
        <img
          class="w-8 h-8 rounded-full border-2 border-white"
          [src]="member.profilePictureUrl"
          [alt]="member.fullName"
        />
      </ng-container>
    </div>

    <!-- Stats -->
    <div class="flex gap-3 text-gray-500 text-sm items-center">
      <div class="flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828L18 9.828a4 4 0 00-5.656-5.656l-1.172 1.172"></path>
        </svg>
        {{ project.attachmentCount || 0 }}
      </div>
      <div class="flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 10l4.553-4.553A1 1 0 0018.553 4H6a2 2 0 00-2 2v14l6-3 6 3V10z"></path>
        </svg>
        {{ project.boardCount || 0 }}
      </div>
    </div>
  </div>
</div>
