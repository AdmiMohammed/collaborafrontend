<div class="min-w-[335px] max-w-[335px] flex flex-col bg-white rounded-xl shadow p-4" [attr.draggable]="!editingName">
  <!-- Header -->
  <div class="w-[90%] mx-auto flex items-center justify-between mb-2 cursor-move select-none">
    <div class="flex items-center space-x-2 min-w-[200px]">
      <div class="w-1.5 h-1.5 rounded-full bg-primary-mid"></div>

      <!-- Inline edit container -->
      <div class="flex-1 min-w-0 max-w-full flex">
        <!-- Title (show when not editing) -->
        <h3 *ngIf="!editingName" class="flex-1 min-w-0 text-lg font-bold text-gray-900 tooltip select-none
             whitespace-normal leading-snug break-words overflow-hidden" data-tooltip="Double-cliquez pour modifier"
          (dblclick)="startEditingName()">
          {{ column.name }}
        </h3>

        <!-- Input (show when editing) -->
        <input *ngIf="editingName" #nameInput type="text" [(ngModel)]="editedName" (blur)="finishEditingName()"
          (keydown.enter)="finishEditingName()"
          class="w-full text-lg font-bold text-gray-900 border-b border-primary-mid focus:outline-none focus:ring-0 focus:border-primary-end" />
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <button class="text-primary-mid hover:text-primary-end transition-colors duration-200 tooltip"
        data-tooltip="Ajouter une carte" type="button" (click)="startAddingTask(true)">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
      </button>
      <!-- Column menu -->
      <div class="relative">
        <!-- Menu button -->
        <button (click)="onToggleMenu($event, column.id)"
          class="text-gray-500 transition-colors duration-200 rounded-md px-1 py-1 tooltip" data-tooltip="Options"
          [ngClass]="{
            'bg-primary-end text-white': menuOpen,
            'text-gray-500 hover:text-primary-end': !menuOpen
          }">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12h12M6 6h12M6 18h12" />
          </svg>
        </button>

        <!-- Dropdown -->
        <div *ngIf="menuOpen" [ngStyle]="{ left: menuLeft + 'px' }"
          class="absolute mt-2 w-56 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden z-50">
          <ul class="divide-y divide-gray-100">
            <li>
              <button
                class="w-full flex items-center gap-3 px-3 py-1.5 hover:bg-primary-start hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
                </svg>

                Archiver la liste
              </button>
            </li>
            <li>
              <button
                class="w-full flex items-center gap-3 px-3 py-1.5 hover:bg-primary-start hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
                </svg>

                Déplacer la liste
              </button>
            </li>
            <li>
              <button (click)="startAddingTask(true)"
                class="w-full flex items-center gap-3 px-3 py-1.5 hover:bg-primary-start hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Ajouter une carte
              </button>
            </li>
            <li>
              <button (click)="startEditingName()"
                class="w-full flex items-center gap-3 px-3 py-1.5 hover:bg-primary-start hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                </svg>

                Renommer la liste
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <div class="h-px w-[90%] bg-primary-mid mx-auto my-2"></div>
  <div
    class="flex flex-col flex-1 overflow-x-hidden overflow-y-auto max-h-[450px] scrollbar-thin scrollbar-track-transparent scrollbar-thumb-background px-4">
    <!-- Tasks -->
    <div class="space-y-4">
      <div *ngFor="let task of column.tasks">
        <app-task-card [task]="task" [members]="members"></app-task-card>
      </div>
    </div>

    <!-- Add task form -->
    <div class="mt-4 w-[90%] mx-auto" #addTaskContainer>
      <ng-container *ngIf="addingTask; else addButton">
        <input #taskInput type="text" [(ngModel)]="newTaskName" placeholder="Titre de la carte"
          class="w-full border border-gray-300 rounded px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-primary-mid"
          (keydown.enter)="confirmAddTask()" />
        <div class="flex justify-center gap-3">
          <button type="button"
            class="bg-primary-mid text-white px-4 py-2 rounded hover:bg-primary-end transition duration-200 font-semibold"
            (click)="confirmAddTask()">
            Ajouter
          </button>
          <button type="button"
            class="px-4 py-2 rounded border border-gray-300 hover:border-primary-mid hover:text-primary-mid transition duration-200 font-semibold"
            (click)="cancelAddTask()">
            Annuler
          </button>
        </div>
      </ng-container>

      <ng-template #addButton>
        <button
          class="w-full bg-primary-mid hover:bg-primary-end text-white py-2 rounded-lg font-semibold transition-colors duration-300 flex items-center gap-1 justify-center"
          type="button" (click)="startAddingTask(true)">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          Ajouter une carte
        </button>
      </ng-template>
    </div>
  </div>


</div>
