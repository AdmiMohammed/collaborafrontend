<div class="flex items-center justify-between p-2">
  <!-- Groupe gauche : bouton sidebar + recherche -->
  <div class="flex items-center gap-3 flex-grow">
    <button (click)="toggleSidebar()" class="text-gray-600 hover:text-gray-800 text-xl">
      <i class="fa-solid fa-bars" style="color: #16306b;"></i>
    </button>

    <div
      class="flex items-center bg-white rounded-full px-4 py-2 w-96 max-w-md mx-2 shadow-sm
             focus-within:ring-2 focus-within:ring-purple-500 focus-within:bg-white transition-all duration-300"
    >
      <i class="fa fa-search text-gray-400 text-sm mr-2"></i>
      <input
        type="text"
        placeholder="Chercher un projet, une tâche, un utilisateur..."
        class="bg-transparent text-sm placeholder-gray-400 w-full focus:outline-none"
      />
    </div>
  </div>

  <!-- Groupe droit : notifications + utilisateur -->
  <div class="flex items-center gap-6 mx-10 relative">
    <!-- Bouton notifications -->
    <button (click)="toggleDropdown($event)" class="relative w-10 h-10 rounded-full flex items-center justify-center bg-gray-100 hover:bg-gray-200 focus:outline-none">
      <i class="fa-regular fa-bell text-gray-600 text-sm"></i>
      <span *ngIf="unreadCount > 0" class="absolute top-1 right-1 w-3 h-3 bg-red-600 rounded-full animate-pulse"></span>
    </button>

    <!-- Dropdown notifications -->
    <div *ngIf="isOpen" 
         class="absolute right-0 top-full mt-2 w-80 bg-white rounded-lg shadow-lg border border-gray-200 z-50 notification-dropdown"
         [@dropdownAnimation]>
      <!-- Header dropdown -->
      <div class="flex items-center justify-between px-4 py-2 border-b">
        <h3 class="font-semibold text-gray-700">Notifications</h3>
        <button (click)="markAllAsRead()" class="text-sm hover:underline" style="color: #C020D0;">Tout marquer comme lu</button>
      </div>

      <!-- Liste notifications -->
      <div class="max-h-64 overflow-y-auto">
        <ng-container *ngIf="notifications.length > 0; else noNotifications">
          <div *ngFor="let notif of notifications" class="flex justify-between items-start px-4 py-3 border-b hover:bg-gray-50 transition notification-item"
               [@notificationItem]>
            <div class="flex items-center gap-3 flex-1">
              <div class="w-6 h-6 flex items-center justify-center">
                <i [class]="getNotificationIcon(notif.notificationType)" class="text-sm" [style.color]="notif.isRead ? '#9CA3AF' : '#C020D0'"></i>
              </div>
              <div class="flex-1">
                <p class="text-sm font-medium text-gray-800" [class.font-bold]="!notif.isRead">{{ notif.content }}</p>
                <p class="text-xs text-gray-400 mt-1">{{ notif.createdAt | date:'dd/MM/yyyy HH:mm' }}</p>
              </div>
            </div>
            <input 
              type="checkbox" 
              [checked]="notif.isRead" 
              (change)="handleNotificationAction(notif.id, $event)" 
              class="circular-checkbox ml-2"
              title="Marquer comme lu et supprimer"
            />
          </div>
        </ng-container>

        <ng-template #noNotifications>
          <div class="p-4 text-center text-gray-500 text-sm">Aucune notification</div>
        </ng-template>
      </div>
    </div>

    <!-- Utilisateur -->
    <div class="flex items-center gap-2">
      <div class="rounded-full w-10 h-10 bg-gray-200 flex items-center justify-center text-gray-700 font-bold text-sm overflow-hidden">
        <ng-container *ngIf="user?.profilePictureUrl; else showInitials">
          <img [src]="user?.profilePictureUrl" alt="Avatar" class="w-full h-full object-cover" />
        </ng-container>
        <ng-template #showInitials>{{ initials }}</ng-template>
      </div>
      <div class="flex flex-col overflow-hidden">
        <p class="text-sm font-semibold text-gray-800 truncate" *ngIf="user">{{ user.firstName }} {{ user.lastName }}</p>
        <p class="text-xs text-gray-500 truncate" [title]="user.email" *ngIf="user">{{ user.email }}</p>
      </div>
    </div>
  </div>
</div>
