<div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[2000]" (click)="onCancel()" @overlayAnimation>
  <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6" (click)="$event.stopPropagation()" @modalAnimation>
    <h2 class="text-lg font-semibold text-[#16306B]">Confirmer la suppression</h2>
    <p class="mt-2 text-sm text-gray-500">
      Êtes-vous sûr de vouloir supprimer {{deletionLabels[type]}}
      <span class="font-medium text-[#16306B]">"{{ itemName }}"</span> ?
      Cette action est irréversible.
    </p>

    <div class="flex justify-end gap-3 mt-6">
      <button (click)="onCancel()"
        class="px-4 py-2 text-sm rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-100 transition">
        Annuler
      </button>

      <button (click)="onConfirm()"
        class="px-4 py-2 text-sm rounded-lg bg-red-600 text-white hover:bg-red-700 transition">
        Supprimer
      </button>
    </div>
  </div>
</div>
