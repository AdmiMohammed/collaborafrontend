<div *ngIf="!task.isArchived" class="group bg-slate-50 rounded-xl shadow-sm border border-gray-200 p-4 cursor-pointer select-none hover:shadow-md
                                   hover:border-purple-400 transition-all duration-200 relative" draggable="true" (click)="openEditModal()">
  <!-- Labels -->
  <div class="flex flex-wrap gap-1 mb-2">
    <span *ngFor="let taskLabel of task.taskLabels" class="flex items-center justify-center px-1.5 py-[1px] text-xs font-medium rounded-md text-white min-w-12 min-h-4"
      [style.backgroundColor]="taskLabel.label.color">
      {{ taskLabel.label.name }}
    </span>
  </div>
  <!-- Title row with edit icon -->
  <div class="flex flex-col mb-2">
    <div class="flex items-start justify-between gap-2">
      <!-- Title view mode -->
      <ng-container *ngIf="!isEditing; else editMode">
        <h4 class="flex-1 text-gray-900 text-sm leading-snug break-words transition-colors min-w-0">
          {{ task.title }}
        </h4>
        <!-- Edit icon -->
        <button class="opacity-0 group-hover:opacity-100 transition p-1 rounded-full hover:bg-background  tooltip" data-tooltip="Modifier le titre"
                (click)="startEditing(); $event.stopPropagation()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
          </svg>
        </button>
      </ng-container>
      <!-- Edit mode -->
      <ng-template #editMode>
        <textarea #titleInput [(ngModel)]="taskTitleDraft" (input)="adjustHeight(titleInput)" (blur)="saveTitle()"
          (click)="$event.stopPropagation()" (keydown.enter)="saveTitle(); $event.preventDefault()"
          (keydown.escape)="cancelEditing()" class="w-full p-1 text-sm font-semibold border-b border-[#16306B] outline-none
               text-gray-800 bg-white resize-none overflow-hidden leading-snug" rows="1"></textarea>
      </ng-template>
    </div>
  </div>
  
  <!-- Optional description -->
  <!-- <p *ngIf="task.description" class="text-gray-500 text-xs line-clamp-2 mb-3">
    {{ task.description }}
  </p> -->

    <!-- priority, deadline -->
    <div class="flex items-center gap-3 text-xs mb-2">
      <!-- Priority -->
      <span *ngIf="task.priority" class="flex items-center gap-1 font-medium tooltip" [ngClass]="{
          'text-[#43A047]': task.priority === 'Low',
          'text-[#FB8C00]': task.priority === 'Medium',
          'text-[#df5b59]': task.priority === 'High'
        }" [attr.data-tooltip]="'Priorité'">
        
        {{ priorityLabels[task.priority] }}
      </span>

      <!-- Deadline -->
      <span *ngIf="task.deadline" class="flex items-center gap-1 tooltip" [ngClass]="{
          'text-gray-500 font-medium': !isDeadlineClose(task.deadline),
          'text-[#f00] font-semibold': isDeadlineClose(task.deadline)
        }" [attr.data-tooltip]="'Date limite'">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        {{ task.deadline| date: 'dd MMM' }}
      </span>
    </div>

  <div class="flex items-center justify-between text-xs text-gray-500">
    <!-- Right: icons -->
    <div class="flex items-center gap-2">
      <!-- Comments -->
      <span *ngIf="task.comments?.length! > 0" class="flex items-center gap-0.5 tooltip" data-tooltip="Commentaires">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"
          class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 1 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" />
        </svg>
        {{ task.comments?.length }}
      </span>
      <!-- Attachments -->
      <span *ngIf="task.attachments?.length! > 0" class="flex items-center gap-1 tooltip" data-tooltip="Pièces jointes">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.44 11.05l-8.49 8.49a5.5 5.5 0 01-7.78-7.78l8.49-8.49a3.5 3.5 0 014.95 4.95l-8.49 8.49a1.5 1.5 0 01-2.12-2.12l8.49-8.49" />
        </svg>
        {{task.attachments?.length}}
      </span>
    </div>
    <!-- Assignee -->
    <div *ngIf="getMemberById(task.assignedTo!) as assignee" class="tooltip" [attr.data-tooltip]="assignee?.fullName">
      <app-avatar [user]="assignee" size="sm" />
    </div>
  </div>

</div>

<!--task modal-->
<app-task-modal *ngIf="isModalOpen" [task]="shallowTaskCopy!" [columnName]="columnName" (close)="closeModal()"
  [projectLabels]="projectLabels" [projectMembers]="members" [createdBy]="createdByUser"
  (save)="saveTask($event)" (labelsChanged)="onLabelsChanged($event)">
</app-task-modal>
