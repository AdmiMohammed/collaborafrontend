<div class="fixed inset-0 bg-black/30 z-[1000] flex items-center justify-center">
  <div 
    class="relative w-full max-w-2xl mx-4 sm:mx-8 rounded-2xl shadow-xl bg-white p-6 sm:p-8 flex flex-col"
    style="max-height: 80vh;" @modalAnimation
  >
    <div class="flex items-center justify-between mb-4 flex-shrink-0">
      <h3 class="text-lg font-semibold text-[#16306B]">
        {{ showTasks ? 'Tâches archivées' : 'Colonnes archivées' }}
      </h3>
      <button 
        class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-gray-200 hover:scale-110 transition transform"
        (click)="close()" aria-label="Fermer"
      >
        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

   <div class="relative flex mb-4 font-semibold text-gray-500">
      <button 
        (click)="toggleView('tasks')" 
        class="px-3 py-1 flex-1 hover:text-gray-400 transition">
        Tâches
      </button>

      <button 
        (click)="toggleView('columns')" 
        class="px-3 py-1 flex-1 hover:text-gray-400 transition">
        Colonnes
      </button>
    <div 
      class="absolute bottom-0 h-[2px] bg-primary-start transition-all duration-500 ease-in-out"
      [ngClass]="showTasks ? 'left-0 w-1/2' : 'left-1/2 w-1/2'">
    </div>
  </div>

  <div class="overflow-y-auto flex-1 scroll-smooth scrollbar-custom min-h-[150px]">
    <div *ngIf="loading" class="text-gray-500 text-center py-6">Chargement...</div>

      <!-- ===================== Tâches ===================== -->
      <ul *ngIf="!loading && showTasks && archivedTasks.length > 0" class="space-y-2 p-2">
        <li *ngFor="let t of archivedTasks" 
            class="border border-gray-300 p-4 rounded-xl flex items-center justify-between hover:bg-gray-50 transition transform"
            style="transition: all 0.3s ease">
          <span class="text-gray-700">{{ t.title }}</span>
          <div class="flex gap-1">
            <button 
              (click)="restoreTask(t)" 
              class="p-2 rounded-lg  hover:bg-gray-200 flex items-center justify-center transition transform">
              <svg width="21" height="21" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5.88468 17C7.32466 19.1128 9.75033 20.5 12.5 20.5C16.9183 20.5 20.5 16.9183 20.5 12.5C20.5 8.08172 16.9183 4.5 12.5 4.5C8.08172 4.5 4.5 8.08172 4.5 12.5V13.5M12.5 8V12.5L15.5 15.5" stroke="#121923" stroke-width="1.2"/>
                <path d="M7 11L4.5 13.5L2 11" stroke="#121923" stroke-width="1.2"/>
              </svg>
            </button>

            <button 
              (click)="deleteTask(t)" 
              class="p-2 rounded-lg hover:bg-gray-200 flex items-center justify-center transition transform">
            <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 48 48" width="20" height="20">
                <path d="M 20.5 4 A 1.50015 1.50015 0 0 0 19.066406 6 L 14.640625 6 C 12.803372 6 11.082924 6.9194511 10.064453 8.4492188 
                L 7.6972656 12 L 7.5 12 A 1.50015 1.50015 0 1 0 7.5 15 L 8.2636719 15 A 1.50015 1.50015 0 0 0 8.6523438 15.007812 L 11.125
                38.085938 C 11.423352 40.868277 13.795836 43 16.59375 43 L 31.404297 43 C 34.202211 43 36.574695 40.868277 36.873047 38.085938
                L 39.347656 15.007812 A 1.50015 1.50015 0 0 0 39.728516 15 L 40.5 15 A 1.50015 1.50015 0 1 0 40.5 12 L 40.302734 12 L 37.935547
                8.4492188 C 36.916254 6.9202798 35.196001 6 33.359375 6 L 28.933594 6 A 1.50015 1.50015 0 0 0 27.5 4 L 20.5 4 z M 14.640625 9
                L 33.359375 9 C 34.196749 9 34.974746 9.4162203 35.439453 10.113281 L 36.697266 12 L 11.302734 12 L 12.560547 10.113281
                A 1.50015 1.50015 0 0 0 12.5625 10.111328 C 13.025982 9.4151428 13.801878 9 14.640625 9 z M 11.669922 15 L 36.330078 
                15 L 33.890625 37.765625 C 33.752977 39.049286 32.694383 40 31.404297 40 L 16.59375 40 C 15.303664 40 14.247023
                39.049286 14.109375 37.765625 L 11.669922 15 z"/>
            </svg>
            </button>
          </div>
        </li>
      </ul>
      <div *ngIf="!loading && showTasks && archivedTasks.length === 0" class="flex items-center justify-center h-full text-gray-500">
        Aucune tâche archivée.
      </div>

      <!-- ===================== Colonnes ===================== -->
      <ul *ngIf="!loading && !showTasks && archivedColumns.length > 0" class="space-y-2 p-2">
        <li *ngFor="let c of archivedColumns" 
            class="border border-gray-300 p-4 rounded-xl flex items-center justify-between hover:bg-gray-50 transition transform"
            style="transition: all 0.3s ease">
          <span class="text-gray-700">{{ c.name }}</span>
          <div class="flex gap-2">
            <button (click)="restoreColumn(c.id)" 
                    class="p-2 rounded-lg  hover:bg-gray-200 flex items-center justify-center transition transform">
              <svg width="21" height="21" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5.88468 17C7.32466 19.1128 9.75033 20.5 12.5 20.5C16.9183 20.5 20.5 16.9183 20.5 12.5C20.5 8.08172 16.9183 4.5 12.5 4.5C8.08172 4.5 4.5 8.08172 4.5 12.5V13.5M12.5 8V12.5L15.5 15.5" stroke="#121923" stroke-width="1.2"/>
                <path d="M7 11L4.5 13.5L2 11" stroke="#121923" stroke-width="1.2"/>
              </svg>
            </button>
            <button (click)="deleteColumn(c.id)" 
                    class="p-2 rounded-lg  hover:bg-gray-200 flex items-center justify-center transition transform">
              <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 48 48" width="20" height="20">
                <path d="M 20.5 4 A 1.50015 1.50015 0 0 0 19.066406 6 L 14.640625 6 C 12.803372 6 11.082924 6.9194511 10.064453 8.4492188 
                L 7.6972656 12 L 7.5 12 A 1.50015 1.50015 0 1 0 7.5 15 L 8.2636719 15 A 1.50015 1.50015 0 0 0 8.6523438 15.007812 L 11.125
                38.085938 C 11.423352 40.868277 13.795836 43 16.59375 43 L 31.404297 43 C 34.202211 43 36.574695 40.868277 36.873047 38.085938
                L 39.347656 15.007812 A 1.50015 1.50015 0 0 0 39.728516 15 L 40.5 15 A 1.50015 1.50015 0 1 0 40.5 12 L 40.302734 12 L 37.935547
                8.4492188 C 36.916254 6.9202798 35.196001 6 33.359375 6 L 28.933594 6 A 1.50015 1.50015 0 0 0 27.5 4 L 20.5 4 z M 14.640625 9
                L 33.359375 9 C 34.196749 9 34.974746 9.4162203 35.439453 10.113281 L 36.697266 12 L 11.302734 12 L 12.560547 10.113281
                A 1.50015 1.50015 0 0 0 12.5625 10.111328 C 13.025982 9.4151428 13.801878 9 14.640625 9 z M 11.669922 15 L 36.330078 
                15 L 33.890625 37.765625 C 33.752977 39.049286 32.694383 40 31.404297 40 L 16.59375 40 C 15.303664 40 14.247023
                39.049286 14.109375 37.765625 L 11.669922 15 z"/>
            </svg>
            </button>
          </div>
        </li>
      </ul>
      <div *ngIf="!loading && !showTasks && archivedColumns.length === 0" class="flex items-center justify-center h-full text-gray-500">
        Aucune colonne archivée.
      </div>
    </div>

  </div>
</div>
