<div 
  [ngClass]="{
    'w-64': isOpen,
    'w-20': !isOpen
  }"
  class="h-screen bg-[#1d0554] p-4 flex flex-col justify-between transition-[width] duration-300 ease-in-out text-white"
>
  <div>
    <!-- Logo + texte Collabora -->
    <div class="mb-16">
      <div *ngIf="isOpen" class="flex items-center mt-3">
        <div class="flex flex-row">
          <img [src]="imgUrl" alt="" class="w-10 h-10 object-cover mx-4" />
          <h1 class="font-bold text-xl mt-1">
            Collabora
          </h1>
        </div>
      </div>

      <div *ngIf="!isOpen" class="flex justify-center">
        <img [src]="imgUrl" alt="" class="w-10 h-10 object-cover" />
      </div>
    </div>

    <!-- Navigation -->
    <nav class="space-y-4 text-sm ml-1">
      <!-- Tableau de bord -->
      <a
        routerLink="./"
        routerLinkActive="bg-white shadow font-semibold text-purple-700"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="[
          'flex items-center transition',
          isOpen ? 'p-3 rounded-xl gap-2' : 'justify-center p-2 rounded-full w-10 h-10'
        ]"
      >
        <i class="fas fa-home"></i>
        <span *ngIf="isOpen">Tableau de bord</span>
      </a>

      <!-- Projets -->
      <a
        routerLink=""
        routerLinkActive="bg-white shadow font-semibold text-purple-700"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="[
          'flex items-center transition',
          isOpen ? 'p-3 rounded-xl gap-2' : 'justify-center p-2 rounded-full w-10 h-10'
        ]"
      >
        <i class="fas fa-diagram-project"></i>
        <span *ngIf="isOpen">Projets</span>
      </a>

      <!-- Statistiques -->
      <a
        routerLink=""
        routerLinkActive="bg-white shadow font-semibold text-purple-700"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="[
          'flex items-center transition',
          isOpen ? 'p-3 rounded-xl gap-2' : 'justify-center p-2 rounded-full w-10 h-10'
        ]"
      >
        <i class="fas fa-chart-line"></i>
        <span *ngIf="isOpen">Statistiques</span>
      </a>

      <!-- Profil -->
      <a
        routerLink="profile"
        routerLinkActive="bg-white shadow font-semibold text-purple-700"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="[
          'flex items-center transition',
          isOpen ? 'p-3 rounded-xl gap-2' : 'justify-center p-2 rounded-full w-10 h-10'
        ]"
      >
        <i class="fas fa-user"></i>
        <span *ngIf="isOpen">Profil</span>
      </a>

      <!-- Paramètres -->
      <a
        routerLink=""
        routerLinkActive="bg-white shadow font-semibold text-purple-700"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="[
          'flex items-center transition',
          isOpen ? 'p-3 rounded-xl gap-2' : 'justify-center p-2 rounded-full w-10 h-10'
        ]"
      >
        <i class="fas fa-cog"></i>
        <span *ngIf="isOpen">Paramètres</span>
      </a>
    </nav>
  </div>

  <!-- Section inférieure : Déconnexion -->
  <div class="text-sm">
    <!-- Déconnexion -->
    <button
      class="px-3 py-2 rounded-lg flex items-center transition w-full"
      [ngClass]="{ 'gap-2': isOpen, 'justify-center': !isOpen }"
      (click)="onLogout()"
    >
      <i class="fas fa-sign-out-alt w-5 text-center"></i>
      <span *ngIf="isOpen">Déconnexion</span>
    </button>
  </div>
</div>
